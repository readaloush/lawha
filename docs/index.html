<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lawha: reads Egyptian licence plates from a photo</title>
<meta name="description" content="Choose a photo of a car. A detector finds the plate and a second network reads its Arabic letters and digits, entirely in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='7' width='30' height='18' rx='3' fill='white' stroke='%2314171a' stroke-width='2'/%3E%3Crect x='2' y='8' width='28' height='6' fill='%232e9be6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Palette taken from the object itself: the plate's blue band, its white body and black
     glyphs, the asphalt it sits above, and the yellow of road markings. */
  :root {
    --concrete: #e6e9ed; --asphalt: #23272d; --asphalt-2: #2f343b; --ink: #14171a;
    --plate: #fbfbf9; --band: #2e9be6; --marking: #f2c200; --dim: #5d6670; --dim-on-dark: #a3acb6;
    --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", Arial, sans-serif;
    --body: "Barlow", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    --kufi: "Noto Kufi Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--concrete); color: var(--ink); font: 400 17px/1.5 var(--body); }
  html[lang="ar"] body { font-family: var(--kufi); font-size: 16px; line-height: 1.8; }
  a { color: inherit; text-underline-offset: 3px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }

  /* top line: plate-shaped wordmark on the left, languages as plain links on the right */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 22px 0 0; }
  .mark { flex: none; display: inline-grid; grid-template-columns: auto auto; border: 2.5px solid var(--ink); border-radius: 6px; overflow: hidden; background: var(--plate); text-decoration: none; }
  .mark b { font: 700 22px/1 var(--display); letter-spacing: 0.06em; padding: 7px 12px 6px; }
  .mark span { font: 700 17px/1 var(--kufi); background: var(--band); color: #fff; padding: 8px 11px 7px; display: grid; place-items: center; }
  .langs { display: flex; gap: 18px; font-size: 15px; }
  @media (max-width: 480px) { .langs { gap: 12px; font-size: 14px; } .mark b { font-size: 19px; padding-inline: 9px; } }
  .langs button { all: unset; cursor: pointer; color: var(--dim); padding: 4px 0; }
  .langs button:hover { color: var(--ink); }
  .langs button[aria-pressed="true"] { color: var(--ink); box-shadow: 0 2px 0 var(--ink); }
  .langs button:focus-visible { outline: 2px solid var(--band); outline-offset: 4px; }

  h1 { font: 700 clamp(40px, 7vw, 76px)/0.98 var(--display); letter-spacing: -0.005em; margin: 44px 0 14px; max-width: 14ch; text-wrap: balance; }
  html[lang="ar"] h1 { font-family: var(--kufi); font-size: clamp(30px, 5vw, 52px); line-height: 1.35; max-width: 18ch; }
  .lede { max-width: 56ch; margin: 0 0 30px; color: #3a4149; }

  /* the bench: one dark slab holding the photo and what was read from it */
  .bench { background: var(--asphalt); color: #eef1f4; }
  .bench .wrap { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0; padding-top: 0; padding-bottom: 0; }
  @media (max-width: 860px) { .bench .wrap { grid-template-columns: 1fr; } }
  .shot { padding: 28px 28px 28px 0; }
  .read { padding: 28px 0 28px 28px; border-inline-start: 1px solid var(--asphalt-2); display: flex; flex-direction: column; }
  @media (max-width: 860px) { .shot { padding: 24px 0 8px; } .read { padding: 16px 0 28px; border: 0; } }

  .finder { position: relative; min-height: 0; display: grid; place-items: center; background: #1a1d22; }
  .finder::before, .finder::after, .finder i::before, .finder i::after { content: ""; position: absolute; width: 26px; height: 26px; border: 3px solid var(--marking); pointer-events: none; }
  .finder::before { top: 0; inset-inline-start: 0; border-inline-end: 0; border-bottom: 0; }
  .finder::after { top: 0; inset-inline-end: 0; border-inline-start: 0; border-bottom: 0; }
  .finder i::before { bottom: 0; inset-inline-start: 0; border-inline-end: 0; border-top: 0; }
  .finder i::after { bottom: 0; inset-inline-end: 0; border-inline-start: 0; border-top: 0; }
  .finder.over { background: #20303d; }
  .finder canvas { display: block; width: 100%; height: auto; }
  .ask { text-align: center; padding: 110px 24px; }
  .ask p { margin: 14px 0 0; color: var(--dim-on-dark); font-size: 15px; }
  .pick { display: inline-block; position: relative; cursor: pointer; font: 600 17px/1 var(--body); color: var(--ink); background: var(--marking); padding: 14px 22px; border-radius: 4px; }
  html[lang="ar"] .pick { font-family: var(--kufi); }
  .pick:hover { background: #ffd21f; }
  .pick:focus-within { outline: 2px solid #fff; outline-offset: 3px; }
  .pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .again { margin-top: 12px; font-size: 15px; color: var(--dim-on-dark); }
  .again label { position: relative; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; color: #eef1f4; }
  .again input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  .state { font-size: 15px; color: var(--dim-on-dark); margin: 0 0 18px; min-height: 1.5em; }
  .state.bad { color: #ffb4a8; }
  .found { display: grid; gap: 26px; }
  .hit { display: grid; gap: 10px; }
  /* the reading, redrawn as the plate it came from */
  .tag { direction: ltr; width: min(100%, 380px); aspect-ratio: 2 / 1; background: var(--plate); color: var(--ink); border: 4px solid var(--ink); border-radius: 10px; overflow: hidden; display: grid; grid-template-rows: 27% 1fr; box-shadow: 0 0 0 2px #cfd4da; }
  .tag .band { background: var(--band); display: flex; justify-content: space-between; align-items: center; padding: 0 6%; color: #0d2a44; }
  .tag .band b { font: 700 clamp(13px, 2.4vw, 19px)/1 var(--display); letter-spacing: 0.12em; }
  .tag .band span { font: 700 clamp(14px, 2.6vw, 20px)/1 var(--kufi); }
  .tag .body { display: grid; grid-template-columns: 1fr 1fr; }
  .tag .body > div { display: grid; place-items: center; font: 700 clamp(26px, 5.4vw, 46px)/1 var(--kufi); white-space: nowrap; }
  .tag .body > div + div { border-inline-start: 3px solid var(--ink); word-spacing: 0.12em; }
  .tag.blank { opacity: 0.22; }
  .from { display: flex; gap: 12px; align-items: center; font-size: 14px; color: var(--dim-on-dark); }
  .from canvas { width: 96px; height: 32px; border-radius: 2px; }
  .none { margin: 0; color: var(--dim-on-dark); max-width: 34ch; }

  /* test-set funnel: a real sequence, so it is drawn as one */
  .proof { padding: 54px 0 20px; }
  .proof h2 { font: 700 30px/1.1 var(--display); margin: 0 0 6px; }
  html[lang="ar"] .proof h2 { font-family: var(--kufi); font-size: 24px; line-height: 1.5; }
  .proof > .wrap > p { margin: 0 0 22px; max-width: 62ch; color: #3a4149; }
  .funnel { display: grid; gap: 8px; max-width: 760px; }
  .step { display: grid; grid-template-columns: 5.2ch 1fr; gap: 14px; align-items: center; }
  .step b { font: 700 26px/1 var(--display); text-align: end; direction: ltr; }
  .step .lane { position: relative; height: 34px; background: #d3d8de; }
  .step .lane i { position: absolute; inset-block: 0; inset-inline-start: 0; background: var(--asphalt); }
  .step:last-child .lane i { background: var(--band); }
  .step .lane span { position: absolute; inset-block: 0; inset-inline-start: 12px; display: flex; align-items: center; color: #fff; font-size: 15px; white-space: nowrap; }
  @media (max-width: 560px) { .step .lane span { font-size: 13px; } }
  .notes { padding-block: 26px 60px; }
  .notes p { max-width: 68ch; margin: 0 0 10px; font-size: 15px; color: var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="mark" href="https://github.com/readaloush/lawha" aria-label="Lawha on GitHub"><b>LAWHA</b><span lang="ar">لوحة</span></a>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="en" lang="en">English</button>
      <button data-lang="tr" lang="tr">Türkçe</button>
      <button data-lang="ar" lang="ar">العربية</button>
    </div>
  </div>
  <h1 data-i18n="h1"></h1>
  <p class="lede" data-i18n="lede"></p>
</div>

<section class="bench">
  <div class="wrap">
    <div class="shot">
      <div class="finder" id="stage"><i></i>
        <div class="ask" id="empty">
          <label class="pick"><input type="file" id="file" accept="image/*"><span data-i18n="choose"></span></label>
          <p data-i18n="drop"></p>
        </div>
        <canvas id="view" hidden></canvas>
      </div>
      <div class="again" id="again" hidden><label><input type="file" id="file2" accept="image/*"><span data-i18n="another"></span></label></div>
    </div>
    <div class="read" aria-live="polite">
      <p class="state" id="status"></p>
      <div class="found" id="plates"></div>
    </div>
  </div>
</section>

<section class="proof">
  <div class="wrap">
    <h2 data-i18n="proofTitle"></h2>
    <p data-i18n="proofText"></p>
    <div class="funnel" id="funnel"></div>
  </div>
</section>
<div class="wrap notes" id="notes"></div>

<script>
// onnxruntime-web: a local copy in ./ort/ is used if present (development), otherwise the CDN.
const ORT_CDN = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/";
const ortLoaded = new Promise((resolve, reject) => {
  const add = (base, next) => {
    const s = document.createElement("script");
    s.src = base + "ort.wasm.min.js";
    s.onload = () => { ort.env.wasm.wasmPaths = base; ort.env.wasm.numThreads = 1; resolve(); };
    s.onerror = next;
    document.head.appendChild(s);
  };
  add(new URL("ort/", document.baseURI).href, () => add(ORT_CDN, () => reject(new Error("onnxruntime-web could not be loaded"))));
});
</script>
<script>
const $ = id => document.getElementById(id);
const LETTERS = [..."أبجدرسصطعفقلمنهوى"], DIGITS = [..."٠١٢٣٤٥٦٧٨٩"];
const CLASSES = [...LETTERS, ...DIGITS], BLANK = CLASSES.length;
const DET = 640, RH = 48, RW = 144, CONF = 0.25, NMS_IOU = 0.7, PAD = 0.10;

const T = {
  en: {
    title: "Lawha: reads Egyptian licence plates from a photo",
    h1: "Reads Egyptian licence plates from a photo.",
    lede: "One network finds the plate, a second reads its Arabic letters and digits. Both run in this tab, so your photo stays on your device.",
    choose: "Choose a photo", drop: "or drop an image anywhere in this frame", another: "Try another photo",
    loading: p => `Loading the two models, ${p}%`, ready: "Ready. Choose a photo of a car.", working: "Looking for plates",
    failed: m => "The models could not be loaded: " + m,
    file: "This page was opened as a file, and browsers block the models that way. Run “python3 -m http.server 8000” in this folder and open http://localhost:8000.",
    done: (n, d, r) => (n === 1 ? "1 plate" : `${n} plates`) + ` found in ${d} ms, read in ${r} ms.`,
    nothing: ms => `No plate found (${ms} ms). The models know Egyptian plates photographed from the front or rear.`,
    from: c => `Cut from your photo. Detector confidence ${c}%.`,
    proofTitle: "How often it gets a plate right",
    proofText: "Measured on vehicles neither model saw in training. A plate only counts at the last step if every character was read correctly.",
    s1: "labelled plates in the test photos", s2: "found by the detector", s3: v => `found and read with no mistake (${v}%)`,
    notes: ['Trained on <a href="https://github.com/ahmedramadan96/EALPR">EALPR</a>, a dataset of Egyptian plates collected mostly from listings of special plates. Everyday plates and plates from other countries may read worse, and computer-drawn plates read badly.',
            'Method, error audit and code: <a href="https://github.com/readaloush/lawha">github.com/readaloush/lawha</a>. Built by <a href="https://readaloush.com">Read Aloush</a>.'],
  },
  tr: {
    title: "Lawha: fotoğraftan Mısır plakası okur",
    h1: "Fotoğraftan Mısır plakası okur.",
    lede: "Bir ağ plakayı bulur, ikincisi üzerindeki Arapça harf ve rakamları okur. İkisi de bu sekmede çalışır; fotoğrafınız cihazınızdan çıkmaz.",
    choose: "Fotoğraf seç", drop: "ya da bir görseli bu çerçeveye bırakın", another: "Başka bir fotoğraf dene",
    loading: p => `İki model yükleniyor, %${p}`, ready: "Hazır. Bir araç fotoğrafı seçin.", working: "Plaka aranıyor",
    failed: m => "Modeller yüklenemedi: " + m,
    file: "Sayfa dosya olarak açıldı; tarayıcılar bu şekilde modelleri engeller. Bu klasörde “python3 -m http.server 8000” çalıştırıp http://localhost:8000 adresini açın.",
    done: (n, d, r) => `${n} plaka ${d} ms'de bulundu, ${r} ms'de okundu.`,
    nothing: ms => `Plaka bulunamadı (${ms} ms). Modeller önden ya da arkadan çekilmiş Mısır plakalarını tanır.`,
    from: c => `Fotoğrafınızdan kesildi. Tespit güveni %${c}.`,
    proofTitle: "Plakayı ne sıklıkla doğru okuyor",
    proofText: "İki modelin de eğitimde görmediği araçlarda ölçüldü. Bir plaka son adımda ancak tüm karakterleri doğru okunduysa sayılır.",
    s1: "test fotoğraflarındaki etiketli plaka", s2: "tespit modelinin bulduğu", s3: v => `bulunan ve hatasız okunan (%${v})`,
    notes: ['Çoğunlukla özel plaka ilanlarından toplanmış Mısır plakaları veri seti <a href="https://github.com/ahmedramadan96/EALPR">EALPR</a> ile eğitildi. Sıradan plakalar ve başka ülkelerin plakaları daha kötü okunabilir; bilgisayarla çizilmiş plakalar kötü okunuyor.',
            'Yöntem, hata incelemesi ve kod: <a href="https://github.com/readaloush/lawha">github.com/readaloush/lawha</a>. Hazırlayan: <a href="https://readaloush.com">Read Aloush</a>.'],
  },
  ar: {
    title: "لوحة: يقرأ لوحات السيارات المصرية من صورة",
    h1: "يقرأ لوحات السيارات المصرية من صورة.",
    lede: "شبكة تحدّد مكان اللوحة، وأخرى تقرأ حروفها وأرقامها العربية. تعملان معًا في هذه الصفحة، فتبقى صورتك على جهازك.",
    choose: "اختر صورة", drop: "أو أفلِت صورة داخل هذا الإطار", another: "جرّب صورة أخرى",
    loading: p => `جارٍ تحميل النموذجين، ${p}%`, ready: "جاهز. اختر صورة سيارة.", working: "جارٍ البحث عن اللوحات",
    failed: m => "تعذّر تحميل النموذجين: " + m,
    file: "فُتحت الصفحة كملف، والمتصفحات تمنع تحميل النماذج بهذه الطريقة. شغّل “python3 -m http.server 8000” في هذا المجلد وافتح http://localhost:8000.",
    done: (n, d, r) => `عُثر على ${n === 1 ? "لوحة واحدة" : n + " لوحات"} في ⁦${d} ms⁩ وقُرئت في ⁦${r} ms⁩.`,
    nothing: ms => `لم يُعثر على لوحة (⁦${ms} ms⁩). النموذجان يعرفان اللوحات المصرية المصوَّرة من الأمام أو الخلف.`,
    from: c => `مقصوصة من صورتك. ثقة الكاشف ${c}%.`,
    proofTitle: "كم مرة يقرأ اللوحة صحيحةً",
    proofText: "قِيس على مركبات لم يرها أيٌّ من النموذجين أثناء التدريب. لا تُحتسب اللوحة في الخطوة الأخيرة إلا إذا قُرئ كل حرف فيها صحيحًا.",
    s1: "لوحة موسومة في صور الاختبار", s2: "عثر عليها الكاشف", s3: v => `عُثر عليها وقُرئت بلا خطأ (${v}%)`,
    notes: ['دُرِّب على <a href="https://github.com/ahmedramadan96/EALPR">EALPR</a>، مجموعة بيانات للوحات المصرية جُمع معظمها من إعلانات اللوحات المميزة. قد تُقرأ اللوحات العادية ولوحات الدول الأخرى بدقة أقل، أما اللوحات المرسومة حاسوبيًا فتُقرأ بشكل سيئ.',
            'المنهج ومراجعة الأخطاء والشيفرة: <a href="https://github.com/readaloush/lawha">github.com/readaloush/lawha</a>. إعداد: <a href="https://readaloush.com">Read Aloush</a>.'],
  },
};

let lang = "en", status = ["loading", 0], manifest = null, sessions = null, last = null;
const t = k => T[lang][k];
function stored(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function pickLang() {
  if (T[stored("lawha-lang")]) return stored("lawha-lang");
  for (const l of navigator.languages || [navigator.language || "en"]) { const c = l.toLowerCase().split("-")[0]; if (T[c]) return c; }
  return "en";
}
function render() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  const [k, ...args] = status, el = $("status");
  el.textContent = typeof t(k) === "function" ? t(k)(...args) : t(k);
  el.classList.toggle("bad", k === "failed" || k === "file");
  $("notes").innerHTML = t("notes").map(n => `<p>${n}</p>`).join("");
  const m = manifest && manifest.metrics;
  $("funnel").innerHTML = !m ? "" : [[m.plates, t("s1")], [m.found, t("s2")], [m.read, t("s3")((m.read / m.plates * 100).toFixed(1))]]
    .map(([n, label]) => `<div class="step"><b>${n}</b><div class="lane"><i style="width:${(n / m.plates * 100).toFixed(2)}%"></i><span>${label}</span></div></div>`).join("");
  showResults(last);
}

// ---------- models ----------
async function fetchParts(parts, total, onBytes) {
  const out = new Uint8Array(total);
  let off = 0;
  for (const p of parts) {
    const buf = new Uint8Array(await (await fetch("models/" + p)).arrayBuffer());
    out.set(buf, off); off += buf.length; onBytes(buf.length);
  }
  return out;
}
async function loadModels() {
  manifest = await (await fetch("models/manifest.json")).json();
  render();
  await ortLoaded;
  const total = manifest.detector.bytes + manifest.reader.bytes;
  let done = 0;
  const tick = n => { done += n; status = ["loading", Math.round(done / total * 100)]; render(); };
  const [d, r] = await Promise.all([fetchParts(manifest.detector.parts, manifest.detector.bytes, tick), fetchParts(manifest.reader.parts, manifest.reader.bytes, tick)]);
  const opt = { executionProviders: ["wasm"] };
  sessions = { detector: await ort.InferenceSession.create(d, opt), reader: await ort.InferenceSession.create(r, opt) };
  status = ["ready"];
  document.documentElement.dataset.ready = "1";
  render();
}

// ---------- stage 1: plate detection ----------
const iou = (a, b) => {
  const ix = Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])), iy = Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
  const inter = ix * iy;
  return inter / ((a[2] - a[0]) * (a[3] - a[1]) + (b[2] - b[0]) * (b[3] - b[1]) - inter + 1e-9);
};
async function detect(src) {
  const w = src.width, h = src.height, s = Math.min(DET / w, DET / h);
  const nw = Math.round(w * s), nh = Math.round(h * s), dx = (DET - nw) / 2, dy = (DET - nh) / 2;
  const c = new OffscreenCanvas(DET, DET), g = c.getContext("2d", { willReadFrequently: true });
  g.fillStyle = "rgb(114,114,114)"; g.fillRect(0, 0, DET, DET);
  g.imageSmoothingQuality = "high";
  g.drawImage(src, 0, 0, w, h, dx, dy, nw, nh);
  const px = g.getImageData(0, 0, DET, DET).data, n = DET * DET, x = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) { x[i] = px[i * 4] / 255; x[n + i] = px[i * 4 + 1] / 255; x[2 * n + i] = px[i * 4 + 2] / 255; }
  const out = (await sessions.detector.run({ images: new ort.Tensor("float32", x, [1, 3, DET, DET]) })).output0;
  const d = out.data, A = out.dims[2], cand = [];
  for (let i = 0; i < A; i++) {
    const conf = d[4 * A + i];
    if (conf < CONF) continue;
    const cx = d[i], cy = d[A + i], bw = d[2 * A + i], bh = d[3 * A + i];
    cand.push({ conf, box: [(cx - bw / 2 - dx) / s, (cy - bh / 2 - dy) / s, (cx + bw / 2 - dx) / s, (cy + bh / 2 - dy) / s] });
  }
  cand.sort((a, b) => b.conf - a.conf);
  const keep = [];
  for (const k of cand) if (keep.every(q => iou(q.box, k.box) < NMS_IOU)) keep.push(k);
  return keep.filter(k => k.box[2] - k.box[0] >= 8 && k.box[3] - k.box[1] >= 4);
}

// ---------- stage 2: plate reading ----------
function cropPlate(src, box) {
  const px = (box[2] - box[0]) * PAD / 2, py = (box[3] - box[1]) * PAD / 2;
  const x0 = Math.max(0, Math.floor(box[0] - px)), y0 = Math.max(0, Math.floor(box[1] - py));
  const x1 = Math.min(src.width, Math.floor(box[2] + px)), y1 = Math.min(src.height, Math.floor(box[3] + py));
  const c = document.createElement("canvas");
  c.width = RW; c.height = RH;
  const g = c.getContext("2d", { willReadFrequently: true });
  g.imageSmoothingQuality = "high";
  g.drawImage(src, x0, y0, x1 - x0, y1 - y0, 0, 0, RW, RH);
  return c;
}
async function readPlate(canvas) {
  const px = canvas.getContext("2d").getImageData(0, 0, RW, RH).data, n = RW * RH, a = new Float32Array(n);
  for (let i = 0; i < n; i++) a[i] = (0.299 * px[i * 4] + 0.587 * px[i * 4 + 1] + 0.114 * px[i * 4 + 2]) / 255;
  const sorted = Float32Array.from(a).sort(), lo = sorted[Math.floor(0.02 * (n - 1))], hi = sorted[Math.ceil(0.98 * (n - 1))], span = Math.max(hi - lo, 1e-3);
  for (let i = 0; i < n; i++) a[i] = Math.min(1, Math.max(0, (a[i] - lo) / span));
  const out = (await sessions.reader.run({ plate: new ort.Tensor("float32", a, [1, 1, RH, RW]) })).logits;
  const [, steps, K] = out.dims, seq = [];
  let prev = BLANK;
  for (let s = 0; s < steps; s++) {
    let best = 0;
    for (let k = 1; k < K; k++) if (out.data[s * K + k] > out.data[s * K + best]) best = k;
    if (best !== prev && best !== BLANK) seq.push(best);
    prev = best;
  }
  return seq;
}

// ---------- run + display ----------
async function analyse(src) {
  if (!sessions) return;
  const view = $("view"), g = view.getContext("2d");
  const scale = Math.min(1, 1280 / Math.max(src.width, src.height));
  view.width = Math.round(src.width * scale); view.height = Math.round(src.height * scale);
  g.drawImage(src, 0, 0, view.width, view.height);
  view.hidden = false; $("empty").hidden = true; $("again").hidden = false;
  status = ["working"]; render();
  await new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));   // let the photo paint before the heavy work
  const t0 = performance.now(), found = await detect(view), t1 = performance.now(), plates = [];
  for (const f of found) {
    const crop = cropPlate(view, f.box);
    plates.push({ ...f, crop, labels: await readPlate(crop) });
  }
  const detMs = (t1 - t0).toFixed(0), readMs = (performance.now() - t1).toFixed(0);
  g.lineWidth = Math.max(3, view.width / 220); g.strokeStyle = "#f2c200";
  for (const p of plates) g.strokeRect(p.box[0], p.box[1], p.box[2] - p.box[0], p.box[3] - p.box[1]);
  last = { plates };
  status = plates.length ? ["done", plates.length, detMs, readMs] : ["nothing", detMs];
  render();
  return last;
}
function plateText(labels) {
  const digits = labels.filter(i => i >= LETTERS.length).map(i => CLASSES[i]).join("");
  const letters = labels.filter(i => i < LETTERS.length).map(i => CLASSES[i]).join(" ");   // left to right, as on the plate
  return { digits, letters };
}
const TAG = (digits, letters, blank) => `<div class="tag${blank ? " blank" : ""}" lang="ar"><div class="band"><b>EGYPT</b><span>مصر</span></div><div class="body"><div>${digits}</div><div>${letters}</div></div></div>`;
function showResults(r) {
  const box = $("plates");
  if (!r || !r.plates.length) { box.innerHTML = TAG("", "", true); return; }
  box.innerHTML = "";
  for (const p of r.plates) {
    const { digits, letters } = plateText(p.labels), row = document.createElement("div");
    row.className = "hit";
    row.innerHTML = TAG(digits, letters, false) + `<div class="from"><canvas width="${RW}" height="${RH}"></canvas><span>${t("from")((p.conf * 100).toFixed(0))}</span></div>`;
    row.querySelector("canvas").getContext("2d").drawImage(p.crop, 0, 0);
    box.appendChild(row);
  }
}

// ---------- wiring ----------
async function openFile(file) {
  if (!file || !file.type.startsWith("image/")) return;
  await analyse(await createImageBitmap(file, { imageOrientation: "from-image" }));
}
for (const id of ["file", "file2"]) $(id).onchange = e => { openFile(e.target.files[0]); e.target.value = ""; };
const stage = $("stage");
stage.ondragover = e => { e.preventDefault(); stage.classList.add("over"); };
stage.ondragleave = () => stage.classList.remove("over");
stage.ondrop = e => { e.preventDefault(); stage.classList.remove("over"); openFile(e.dataTransfer.files[0]); };
document.querySelectorAll(".langs button").forEach(b => { b.onclick = () => { lang = b.dataset.lang; store("lawha-lang", lang); render(); }; });
lang = pickLang();
render();
loadModels().catch(err => { status = location.protocol === "file:" ? ["file"] : ["failed", err.message]; render(); });

// Hooks used by tests/browser_check.py
window.lawha = { analyse, CLASSES };
</script>
